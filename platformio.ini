; Build PlatformIO du routeur F1ATB (équivalent Arduino IDE : ESP32 Dev Module, partition custom, core 3.3.x)
[platformio]
src_dir = Solar_Router_V17_29
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = Solar_Router_V17_29/partitions.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB
monitor_speed = 115200
build_flags =
    -Wno-missing-field-initializers
    -I"${platformio.src_dir}"
lib_ignore = OneWire
lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    milesburton/DallasTemperature
    plageoj/UrlEncode
    lovyan03/LovyanGFX
    networking-for-arduino/EthernetESP32
